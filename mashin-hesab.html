<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="logo4.png">
    <title>ماشین حساب</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calculatur">
        <div class="output"><input type="text" class="text" placeholder="0" value=""></div>
    </div>
    
    <div>
        <input type="button" value="AC" class="dokme">
        <input type="button" value="Del" class="dokme">
        <input type="button" value="%" class="amalgar">
        <input type="button" value="/" class="amalgar">
    </div>

    <div>
        <input type="button" value="7" class="adad">
        <input type="button" value="8" class="adad">
        <input type="button" value="9" class="adad">
        <input type="button" value="*" class="amalgar">
    </div>

    <div>
        <input type="button" value="4" class="adad">
        <input type="button" value="5" class="adad">
        <input type="button" value="6" class="adad">
        <input type="button" value="-" class="amalgar">
    </div>

    <div>
        <input type="button" value="1" class="adad">
        <input type="button" value="2" class="adad">
        <input type="button" value="3" class="adad">
        <input type="button" value="+" class="amalgar">
    </div>

    <div>
        <input type="button" value="." class="amalgar">
        <input type="button" value="0" class="adad">
        <input type="button" value="=" class="mosavi">
    </div>




    <script src="script.js"></script>



</body>
</html>
