<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>number guessing game</title>
    <link rel="stylesheet" href="hads-adad.css">
    <link rel="icon" type="image/png" href="logo4.png">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="box">
    <div class="game">
        <h1 class="title">
            بازی حدس عدد
        </h1>
        <p class="text">
            یک عدد از  1  تا 100 انتخاب کنید
        </p>
        <input type="number" id="guessInput" placeholder="حدس خود را وارد کنید">
        <button id="checkButton">بررسی</button>
        <p class="text" id="message">
        </p>
        <button id="newGameButton">حدس عدد جدید</button>
    </div>
    </div>
    <script src="hads-adad.js"></script>
</body>
</html>
